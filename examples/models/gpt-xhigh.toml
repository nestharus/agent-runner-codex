# Codex Astra route for the standard model label.
provider = { binary = "agent-runner-codex" }

[[inputs]]
default_input = true
description = "The text prompt"
name = "prompt"
required = true
type = "string"

[[providers]]
args = ["-m", "gpt-6-astra", "-c", "model_reasoning_effort=\"xhigh\""]
