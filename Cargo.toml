[package]
name = "agent-runner-codex"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fs2 = "0.4"
libc = "0.2"
tempfile = "3"
toml = "0.8"

[dev-dependencies]
jsonschema = { version = "0.18", features = ["draft202012"] }
